<style>
:root{

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.7;
  background-image:radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%);background-attachment:fixed}
.wrap{max-width:1220px;margin:0 auto;padding:22px clamp(14px,3vw,26px) 60px;display:grid;gap:18px}
h1,h2,h3{margin:0;line-height:1.35;font-weight:700}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.82rem}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand .bt{display:grid;gap:1px;padding-inline-start:14px;border-inline-start:1px solid var(--line)}
.brand .bt b{font-size:1.12rem;font-weight:800;letter-spacing:-.01em}
.brand .bt span{font-size:.82rem;color:var(--muted)}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:99px;padding:5px 11px}
.chip .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.lang{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px;box-shadow:var(--shadow-sm)}
.lang button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.82rem;padding:6px 14px;border-radius:99px;cursor:pointer;transition:.15s}
.lang button.on{background:var(--brand);color:#fff}

/* hero */
.hero{background:linear-gradient(120deg, color-mix(in srgb,var(--brand) 10%, var(--panel)), var(--panel) 60%);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
.hero .h-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.hero .h-ic svg{width:22px;height:22px}
.hero .h-tx{flex:1;min-width:220px}
.hero .h-tx b{font-weight:700}
.hero h2{font-size:1.05rem;margin-bottom:2px}

/* player */
.player{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.pbtn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.88rem;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s}
.pbtn:hover{border-color:var(--accent)}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pbtn svg{width:15px;height:15px}
.tl{flex:1;min-width:150px;height:5px;-webkit-appearance:none;appearance:none;background:var(--line);border-radius:99px;outline:none}
.tl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--panel);box-shadow:var(--shadow-sm)}
.tl::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--panel)}
.pos{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.sel{font:inherit;font-size:.84rem;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--panel2);color:var(--ink);cursor:pointer}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);display:grid;gap:3px;position:relative;overflow:hidden}
.kpi .ic{position:absolute;inset-inline-end:12px;top:12px;opacity:.5}
.kpi .ic svg{width:18px;height:18px}
.kpi .v{font-size:1.85rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.kpi .l{font-size:.82rem;color:var(--muted)}
.kpi.gold{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}.kpi.gold .v{color:var(--gold)}.kpi.gold .ic{color:var(--gold)}
.kpi.bad{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}.kpi.bad .v{color:var(--bad)}.kpi.bad .ic{color:var(--bad)}
.kpi.ok .ic{color:var(--accent)}

/* cards & grid */
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.col{display:grid;gap:18px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm);display:grid;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:1rem}
.card-h .hint{font-size:.78rem;color:var(--muted)}
.chart{width:100%;height:150px;display:block}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

/* incidents */
.incs{display:grid;gap:12px}
.inc{border:1px solid var(--line);border-inline-start:3px solid var(--bad);border-radius:var(--r-sm);padding:14px;display:grid;gap:9px;background:var(--panel2)}
.inc.closed{border-inline-start-color:var(--muted)}
.inc.blocked{border-inline-start-color:var(--ok)}
.inc-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.inc-t{font-weight:700;font-size:.95rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:600;padding:.12em .7em;border-radius:99px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.mut{background:var(--line2);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:5px 16px;font-size:.84rem;color:var(--muted)}
.facts b{color:var(--ink);font-variant-numeric:tabular-nums}
.why{font-size:.9rem;color:var(--ink2);background:var(--panel);border-radius:8px;padding:8px 11px;border:1px solid var(--line2)}
.why .lead{color:var(--muted)}
details summary{cursor:pointer;font-size:.8rem;color:var(--accent-ink);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ "}
.ex{margin-top:7px;display:grid;gap:3px;font-size:.76rem;overflow-x:auto;background:var(--panel);border-radius:8px;padding:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:.83rem;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.empty{color:var(--muted);font-size:.9rem;padding:12px 0;text-align:center}

/* tables */
.tbl{overflow-x:auto;border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:8px 10px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel2)}
td.q{max-width:300px;overflow:hidden;text-overflow:ellipsis}
.num-bad{color:var(--bad);font-weight:700}
.al-wrap{max-height:430px;overflow-y:auto}
.manual{display:flex;gap:8px;flex-wrap:wrap}
.manual input{flex:1;min-width:130px;font:inherit;font-size:.85rem;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}

footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:16px;margin-top:4px;font-size:.84rem;color:var(--muted)}
footer .f-brand{display:flex;align-items:center;gap:10px}
footer .logo{width:92px}
.toast{position:fixed;bottom:18px;inset-inline-start:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:9;max-width:calc(100vw - 36px)}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <div class="card-h"><h2 data-t="trafficTitle"></h2>
      <div class="legend"><span><span class="sw" style="background:var(--accent)"></span><span data-t="legQueries"></span></span><span><span class="sw" style="background:var(--bad)"></span><span data-t="legAlerts"></span></span></div></div>

let L = 'ar', tr = T.ar, S = null;

const tfmt = ts => new Date(ts*1000).toLocaleTimeString(tr.loc,{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});

const bytes = b => b>=1024 ? (b/1024).toFixed(1)+' '+tr.KB : Math.round(b)+' '+tr.B;
const dur = s => s<90 ? Math.round(s)+' '+tr.sec : s<5400 ? Math.round(s/60)+' '+tr.min : (s/3600).toFixed(1)+' '+tr.hour;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2800);}

function chart(series){
  const svg=$('chart'); if(!series.length){svg.innerHTML='';return;}
  const n=120,W=1000,H=150,bw=W/n,max=Math.max(1,...series.map(s=>s[1]));
  const last=series[series.length-1][0],start=last-(n-1)*5,by=new Map(series.map(s=>[s[0],s]));
  const rtl=tr.dir==='rtl'; let h='';
  for(let i=0;i<n;i++){const s=by.get(start+i*5); if(!s)continue;
    const x=rtl ? W-(i+1)*bw : i*bw;
    const hq=s[1]/max*(H-8),ha=s[2]/max*(H-8);
    h+=`<rect x="${(x+1).toFixed(1)}" y="${(H-hq).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${hq.toFixed(1)}" rx="1.5" fill="var(--accent)" opacity=".5"/>`;
    if(s[2]) h+=`<rect x="${(x+1).toFixed(1)}" y="${(H-Math.max(ha,3)).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(ha,3).toFixed(1)}" rx="1.5" fill="var(--bad)"/>`;}
  svg.innerHTML=h;
}
function incCard(i){
  const cls=i.blocked?'blocked':(i.active?'':'closed');
  const tags=[i.active?`<span class="tag">${tr.active}</span>`:`<span class="tag mut">${tr.stopped}</span>`];
  if(i.blocked) tags.push(`<span class="tag ok">${tr.blocked}</span>`);
  return `<article class="inc ${cls}">
    <div class="inc-h"><span class="inc-t">#${i.id} · <span class="mono">${esc(i.client)}</span> → <span class="mono">${esc(i.domain)}</span></span><span class="tags">${tags.join('')}</span></div>
    <div class="facts"><span><b>${nf.format(i.alerts)}</b> ${tr.alerts}</span><span>${tr.approx} <b>${bytes(i.est_bytes)}</b></span>
      <span>${tr.from} ${dfmt(i.first)}</span><span>${tr.duration} <b>${dur(i.last-i.first)}</b></span><span>${tr.maxscore} <b>${i.max_score.toFixed(3)}</b></span></div>
    <div class="why"><span class="lead">${tr.reason}</span> ${esc(i.why)}</div>
    <details><summary>${tr.examples}</summary><div class="ex mono">${i.examples.map(e=>'<span>'+esc(e)+'</span>').join('')}</div></details>
    <div class="acts"><button class="btn bad" data-demo="1">${tr.blockDomain}</button><button class="btn" data-demo="1">${tr.allow}</button></div></article>`;
}
function render(){
  const s=S,st=s.stats;
  $('status').innerHTML=`<span><span class="pulse" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-inline-end:6px"></span>${tr.running} · <span class="mono">${tr.sim}</span></span> &nbsp; ${tr.models}: <span class="mono">${esc(s.info.family)}</span> &nbsp; ${tr.cnn}: ${s.info.cnn?tr.on:tr.off}`;
  $('k-q').textContent=nf.format(st.queries); $('k-a').textContent=nf.format(st.alerts);
  $('k-i').textContent=nf.format(s.open_incidents); $('k-it').textContent=nf.format(st.incidents); $('k-b').textContent=nf.format(s.blocked.length);
  const recent=s.series.slice(-12); $('k-rate').textContent=recent.length?(recent.reduce((a,b)=>a+b[1],0)/(recent.length*5)).toFixed(1):'0';
  chart(s.series);
  $('incs').innerHTML=s.incidents.length?s.incidents.map(incCard).join(''):`<p class="empty">${tr.noInc}</p>`;
  $('clients').innerHTML=s.clients.map(c=>`<tr><td class="mono">${esc(c.client)}</td><td>${nf.format(c.queries)}</td><td class="${c.alerts?'num-bad':''}">${nf.format(c.alerts)}</td></tr>`).join('')||`<tr><td colspan="3" class="empty">${tr.dash}</td></tr>`;
  $('blocked').innerHTML=s.blocked.length?'<div class="tbl"><table><tbody>'+s.blocked.map(b=>`<tr><td class="mono">${esc(b.domain)}</td><td class="small muted">${dfmt(b.at)}</td></tr>`).join('')+'</tbody></table></div>':`<p class="empty">${tr.noBlocked}</p>`;
  $('alerts').innerHTML=s.alerts.slice(0,25).map(a=>`<tr><td>${tfmt(a.ts)}</td><td class="mono">${esc(a.client)}</td><td class="q mono" title="${esc(a.query)}">${esc(a.query)}</td><td>${a.score.toFixed(3)}</td><td class="small">${esc(a.why)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">${tr.noAlerts}</td></tr>`;
  $('model').textContent=`${s.info.family} · ${s.info.model}`;
}
function applyStatic(){
  document.documentElement.lang=L; document.documentElement.dir=tr.dir;
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.getAttribute('data-t'); if(tr[k]!=null) e.textContent=tr[k];});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===L));
  $('pp').innerHTML=(playing?ic.pause+' '+tr.pause:ic.play+' '+tr.play);
  $('rs').innerHTML=ic.restart+' '+tr.restart;
}

// player
let idx=0, playing=true, timer=null;
const spd=()=>parseInt($('sp').value,10);
function show(i){idx=Math.max(0,Math.min(FR().length-1,i)); S=FR()[idx]; render(); $('tl').value=idx; $('pos').textContent=`${tr.frame} ${idx+1} / ${FR().length}`;}
function step(){if(!playing)return; if(idx>=FR().length-1){pause();return;} show(idx+1);}
function play(){playing=true; applyStatic(); if(idx>=FR().length-1) idx=0; clearInterval(timer); timer=setInterval(step,spd()); if(idx===0)show(0);}
function pause(){playing=false; applyStatic(); clearInterval(timer);}
$('pp').onclick=()=>playing?pause():play();
$('rs').onclick=()=>{idx=0;show(0);play();};
$('sp').onchange=()=>{if(playing){clearInterval(timer);timer=setInterval(step,spd());}};
$('tl').max=FR().length-1;
$('tl').oninput=e=>{pause();show(parseInt(e.target.value,10));};
function setLang(x){L=x; tr=T[x]; applyStatic(); $('tl').max=FR().length-1; show(idx); if(playing)play();}
